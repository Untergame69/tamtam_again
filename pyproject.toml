[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamtam-again"
version = "0.1.0"
description = "Collecte et analyse reproductible de données publiques de comptes on-chain"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tamtam-again = "tamtam_again.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
